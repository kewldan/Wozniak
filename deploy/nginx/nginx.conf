server {
  listen 80;
  server_name _;

  # Docker DNS: resolve upstreams per request so nginx starts
  # even if a backend container is not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $server_upstream http://server:8080;
  set $web_upstream http://web:3000;

  client_max_body_size 64k;

  location /api/ {
    proxy_pass $server_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
